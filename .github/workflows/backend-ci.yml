name: CI & AI Evaluation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Pytest & AI Evaluation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: hirely_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/hirely_test
      JWT_SECRET_KEY: ci-testing-jwt-secret-key-minimum-32-chars-long
      GEMINI_API_KEY: ci-dummy-gemini-key-for-deterministic-eval
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run database migrations
        working-directory: ./backend
        run: |
          python -m alembic upgrade head

      - name: Run Deterministic Backend Tests
        working-directory: ./backend
        run: |
          python -m pytest -m "not integration and not eval_live" -v

      - name: Run Deterministic AI Evaluation Runner
        working-directory: ./backend
        run: |
          python -m app.ai.eval.runner --dataset app/ai/eval/datasets/candidate_evidence_eval_v1.json

  frontend:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

      - name: Run Production Build
        working-directory: ./frontend
        run: npm run build
